# Bedrock settings. Lines are "key = value"; a line starting with # is a comment.
# Everything below is the default: remove the # in front of a line to change it.
# Edit this file on any computer; Bedrock reads it from the stick when it starts.

# Who ran the tests, for the records and the inventory.
# operator =
# organization =
# location =

# menu: show the menu. station: run the whole station run by itself at boot
# (test, document, export), then show the menu.
# mode = menu

# yes: ask for an asset tag at the start of a station run (Enter skips).
# An empty operator is asked for too.
# ask_asset_tag = no

# Seconds of CPU stress on every core. 0 skips it.
# cpu_seconds = 30

# quick: up to 64 MiB. full: all free memory. off: skip.
# memory = quick

# sampled: 256 blocks spread over each disk. full: every block. off: skip.
# disk_scan = sampled

# off: never. ask: the operator picks the disk and confirms, as in the menu.
# auto: erase every internal disk with no questions; it needs the exact line
# below. The boot stick and USB disks are never touched.
# wipe = off
# wipe_confirm = ERASE ALL INTERNAL DISKS

# yes: power off after the result screen has been shown for 60 seconds, or a key.
# poweroff_when_done = no
