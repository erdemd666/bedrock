# BIOS boot menu: vesamenu over the 640x480 background from art.py.
# ifcpu64.c32 picks the 64-bit or the 32-bit kernel. "quiet" also hides SYSLINUX's
# own "Loading ..." lines.
SERIAL 0 115200
UI vesamenu.c32
TIMEOUT 50
NOESCAPE 1
ALLOWOPTIONS 0
DEFAULT bedrock

MENU RESOLUTION 640 480
MENU BACKGROUND /boot/syslinux/background.png
MENU CLEAR
MENU WIDTH 80
MENU MARGIN 29
MENU VSHIFT 15
MENU ROWS 2
MENU TIMEOUTROW 22
MENU TABMSG
MENU AUTOBOOT Starting in # s
MENU COLOR screen      0 #00000000 #00000000 none
MENU COLOR border      0 #00000000 #00000000 none
MENU COLOR title       0 #00000000 #00000000 none
MENU COLOR scrollbar   0 #00000000 #00000000 none
MENU COLOR tabmsg      0 #00000000 #00000000 none
MENU COLOR unsel       0 #ff8a8f98 #00000000 none
MENU COLOR hotkey      0 #ff8a8f98 #00000000 none
MENU COLOR sel         0 #fff0f0f0 #ff262a31 none
MENU COLOR hotsel      0 #fff0f0f0 #ff262a31 none
MENU COLOR timeout_msg 0 #ff5f6670 #00000000 none
MENU COLOR timeout     0 #ff5f6670 #00000000 none

LABEL bedrock
	MENU LABEL Start Bedrock
	COM32 ifcpu64.c32
	APPEND bedrock_64 -- bedrock_32

LABEL memtest
	MENU LABEL Full memory test
	COM32 ifcpu64.c32
	APPEND memtest_64 -- memtest_32

LABEL bedrock_64
	MENU HIDE
	LINUX /boot/vmlinuz64
	APPEND quiet loglevel=0 vt.global_cursor_default=0 console=ttyS0,115200 console=tty0

LABEL bedrock_32
	MENU HIDE
	LINUX /boot/vmlinuz32
	APPEND quiet loglevel=0 vt.global_cursor_default=0 console=ttyS0,115200 console=tty0

LABEL memtest_64
	MENU HIDE
	LINUX /boot/memtest64.bin

LABEL memtest_32
	MENU HIDE
	LINUX /boot/memtest32.bin
