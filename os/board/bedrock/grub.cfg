# UEFI boot menu, shared by BOOTX64.EFI and BOOTIA32.EFI. The look is theme/theme.txt.
serial --unit=0 --speed=115200
loadfont /boot/grub/theme/sans-14.pf2
loadfont /boot/grub/theme/sans-18.pf2
set gfxmode=auto
set gfxpayload=keep
terminal_input console serial
terminal_output gfxterm serial
set theme=/boot/grub/theme/theme.txt
# Black on black: hides the "Booting `...'" line GRUB prints when an entry starts.
set color_normal=black/black
set timeout=5
set default=0

if [ "$grub_cpu" = "x86_64" ]; then
	set kernel=/boot/vmlinuz64
	set memtest=/boot/memtest64.efi
else
	set kernel=/boot/vmlinuz32
	set memtest=/boot/memtest32.efi
fi
export kernel memtest

menuentry "Start Bedrock" {
	linux $kernel quiet loglevel=0 vt.global_cursor_default=0 console=ttyS0,115200 console=tty0
}

menuentry "Full memory test" {
	chainloader $memtest
}
